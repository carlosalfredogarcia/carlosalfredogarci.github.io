<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias · Mary Lu Art</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Figtree:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&display=swap" rel="stylesheet">
<style>
:root{--tinta:#141414;--gris:#6e6e6e;--linea:#e9e9e9;--suave:#f6f6f6;--display:'Fraunces',Georgia,serif;--body:'Figtree',system-ui,sans-serif;--mano:'Caveat',cursive}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--tinta);background:#fff;line-height:1.6;font-size:17px}
header{border-bottom:1px solid var(--linea)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;font-family:var(--display);letter-spacing:.18em;font-weight:500}
.brand img{height:44px}
main{padding:48px 0 80px}
.tick{font-family:var(--mano);font-size:44px;line-height:1}
h1{font-family:var(--display);font-weight:500;font-size:clamp(32px,5vw,46px);line-height:1.1;margin:6px 0 10px}
p{color:var(--gris);margin:8px 0}
.box{border:1px solid var(--linea);border-radius:4px;padding:16px 18px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.box b{display:block;color:var(--tinta)}
.box small{color:var(--gris)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--tinta);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:99px;border:0;font:inherit;font-weight:700;cursor:pointer}
.btn.line{background:#fff;color:var(--tinta);border:1.5px solid var(--tinta)}
.err{color:#b3261e}
ul{list-style:none;padding:0;margin:14px 0}
li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--linea);padding:10px 0}
.tot{font-weight:700;color:var(--tinta);border-top:1px solid var(--tinta)}
a:focus-visible,button:focus-visible{outline:2px solid var(--tinta);outline-offset:3px}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="/"><img src="/img/logo.png" alt=""><span>MARY LU ART</span></a></div></header>
<main><div class="wrap" id="app" aria-live="polite"></div></main>
<script>
const T = {
  es:{wait:'Confirmando tu pago…', thanks:'¡gracias!', h:'Tu pedido está confirmado', pending:'Estamos esperando la confirmación de tu pago. Esta página se actualizará sola; si tardas más de un minuto, revisa tu correo.',
      mail:e=>`Te hemos enviado un correo a <b>${e}</b> con el resumen y tus enlaces.`, dl:'Tus descargas', dlNote:'Los enlaces caducan a los 7 días. También los tienes en el correo.', get:'Descargar',
      phys:'Prepararé tu pedido con cariño y te escribiré cuando salga. El envío es gratis a Canarias y Península.', exp:'Los enlaces de descarga de este pedido han caducado. Escríbeme a marylujr.art@gmail.com y te los envío de nuevo.',
      total:'Total', back:'Volver a la tienda', err:'No hemos podido cargar tu pedido. Si has pagado, revisa tu correo o escríbeme a marylujr.art@gmail.com.'},
  en:{wait:'Confirming your payment…', thanks:'thank you!', h:'Your order is confirmed', pending:'We are waiting for your payment to be confirmed. This page will refresh by itself; if it takes more than a minute, check your email.',
      mail:e=>`We emailed <b>${e}</b> with the summary and your links.`, dl:'Your downloads', dlNote:'Links expire after 7 days. You also have them in your email.', get:'Download',
      phys:'I will prepare your order with care and write to you when it ships. Shipping is free to the Canary Islands and mainland Spain.', exp:'The download links for this order have expired. Write to me at marylujr.art@gmail.com and I will send them again.',
      total:'Total', back:'Back to the shop', err:'We could not load your order. If you have paid, check your email or write to me at marylujr.art@gmail.com.'}
};
let lang = 'es';
try { lang = localStorage.getItem('mla-lang') || ((navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en'); } catch (e) {}
const q = new URLSearchParams(location.search).get('session_id') || '';
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = c => { const v = c / 100; return (Number.isInteger(v) ? v : v.toFixed(2)) .toString().replace('.', ',') + ' €'; };
const show = html => { app.innerHTML = html; };
const back = x => `<p style="margin-top:28px"><a class="btn line" href="/">${x.back}</a></p>`;

async function load(tries = 0) {
  let x = T[lang];
  if (!q) { show(`<p class="err">${x.err}</p>${back(x)}`); return; }
  show(`<p>${x.wait}</p>`);
  try {
    const r = await fetch('/api/order?session_id=' + encodeURIComponent(q));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'error');
    lang = d.lang || lang; x = T[lang]; document.documentElement.lang = lang;
    if (d.status !== 'paid') {
      show(`<p>${x.pending}</p>`);
      if (tries < 20) setTimeout(() => load(tries + 1), 3000);
      return;
    }
    try { localStorage.removeItem('mla-cart3'); } catch (e) {}
    show(`<div class="tick">${x.thanks} ♡</div><h1>${x.h}</h1>` +
      (d.email ? `<p>${x.mail(esc(d.email))}</p>` : '') +
      `<ul>${d.items.map(i => `<li><span>${esc(i.name)}${i.qty > 1 ? ' × ' + i.qty : ''}</span><span>${eur(i.total)}</span></li>`).join('')}<li class="tot"><span>${x.total}</span><span>${eur(d.total)}</span></li></ul>` +
      (d.downloads.length ? `<h2 style="font-family:var(--display);font-weight:500;margin:28px 0 4px">${x.dl}</h2><p>${x.dlNote}</p>` +
        d.downloads.map(f => `<div class="box"><div><b>${esc(f.name)}</b><small>${esc(f.filename)}</small></div><a class="btn" href="${esc(f.url)}">${x.get} ⬇</a></div>`).join('') : '') +
      (d.expired && d.items.some(i => i.kind === 'digital') ? `<p class="err">${x.exp}</p>` : '') +
      (d.physical ? `<p>${x.phys}</p>` : '') + back(x));
  } catch (e) {
    if (tries < 3) return setTimeout(() => load(tries + 1), 2000);
    show(`<p class="err">${x.err}</p>${back(x)}`);
  }
}
load();
</script>
</body>
</html>
